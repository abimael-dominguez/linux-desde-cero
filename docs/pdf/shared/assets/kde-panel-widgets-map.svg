  <rect x="890" y="149" width="94" height="70" rx="8" fill="#eef5f8"/><text x="937" y="180" fill="#45667c" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Notas</text><text x="937" y="205" fill="#1781b2" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">＋</text>
