    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263442"/><stop offset="1" stop-color="#141c25"/></linearGradient>
  </defs>
  <rect width="1200" height="650" rx="22" fill="url(#desktop)"/>
  <path d="M0 420C210 280 430 480 670 365s304-190 530-45v330H0Z" fill="#d06f4d" opacity=".75"/>
  <rect x="36" y="510" width="1128" height="94" rx="12" fill="url(#panel)"/>
