<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Añadir un elemento al panel de KDE Plasma</title>
  <desc id="desc">Mapa visual: clic derecho sobre el panel, elegir Añadir elementos gráficos, seleccionar un widget y bloquearlo.</desc>
