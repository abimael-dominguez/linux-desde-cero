  <text x="710" y="320" fill="#38516a" font-family="Arial, sans-serif" font-size="20">Opciones del panel</text>
  <line x1="700" y1="336" x2="1044" y2="336" stroke="#d7e1e7"/>
  <rect x="694" y="350" width="356" height="48" rx="5" fill="#dff1fb"/>
