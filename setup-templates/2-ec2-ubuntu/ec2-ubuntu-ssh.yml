AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Entorno principal del curso Linux: una EC2 Ubuntu en una red publica con
  acceso SSH limitado a una sola IPv4.

Parameters:
  ProjectName:
    Type: String
    Default: linux-course
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    ConstraintDescription: Usa 3-31 caracteres en minusculas, numeros o guiones.
    Description: Prefijo para los nombres visibles de los recursos.

  UbuntuAmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI Ubuntu Server LTS x86_64 elegida en esta misma region.

  UbuntuInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: Tipo de instancia para la EC2 del laboratorio.

  UbuntuKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key Pair creado previamente en esta misma region.

  SshAllowedCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
    ConstraintDescription: Usa una IPv4 publica individual con /32, por ejemplo 203.0.113.10/32.
    Description: IPv4 publica de la computadora del alumno autorizada para SSH.

  VpcCidr:
    Type: String
    Default: 10.10.0.0/16
    Description: Red privada del entorno principal.

  PublicSubnetCidr:
    Type: String
    Default: 10.10.1.0/24
    Description: Subnet publica de la EC2 principal.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: Course
          Value: linux-desde-cero

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'SSH only from ${SshAllowedCidr}'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH from the current public IPv4 of the student
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshAllowedCidr
      SecurityGroupEgress:
        - Description: Outbound access for updates, Git and VS Code Server
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ssh-sg'

  UbuntuInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref UbuntuInstanceType
      KeyName: !Ref UbuntuKeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SshSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      CreditSpecification:
        CPUCredits: standard
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ubuntu'
        - Key: Course
          Value: linux-desde-cero

Outputs:
  StackName:
    Description: Stack que agrupa y elimina el laboratorio.
    Value: !Ref AWS::StackName

  InstanceId:
    Description: ID de la EC2 Ubuntu.
    Value: !Ref UbuntuInstance

  PublicIp:
    Description: IPv4 publica para SSH y VS Code.
    Value: !GetAtt UbuntuInstance.PublicIp

  PublicDnsName:
    Description: DNS publico para SSH y VS Code.
    Value: !GetAtt UbuntuInstance.PublicDnsName

  RemoteUser:
    Description: Usuario remoto de Ubuntu.
    Value: ubuntu

  SecurityGroupId:
    Description: Security Group que protege SSH.
    Value: !Ref SshSecurityGroup

  SshCommand:
    Description: Comando desde la computadora con la ruta usada en la guia.
    Value: !Sub 'ssh -i ~/.ssh/linux-course-key.pem ubuntu@${UbuntuInstance.PublicDnsName}'
