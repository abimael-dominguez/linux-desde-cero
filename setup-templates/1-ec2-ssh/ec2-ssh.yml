AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Destino temporal para la practica SSH/SCP: una EC2 Ubuntu en su propia red
  publica con acceso SSH limitado al cliente indicado.

Parameters:
  ProjectName:
    Type: String
    Default: linux-ssh-target
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    ConstraintDescription: Usa 3-31 caracteres en minusculas, numeros o guiones.
    Description: Prefijo para los nombres visibles de los recursos.

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI Ubuntu Server LTS x86_64 elegida en esta misma region.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: Tipo pequeno usado durante la practica.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key Pair publico importado para la conexion cliente-servidor.

  AllowedCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
    ConstraintDescription: Usa una IPv4 publica individual con /32, por ejemplo 203.0.113.10/32.
    Description: IPv4 publica del cliente Linux autorizada para SSH.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: Red privada del destino SSH.

  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24
    Description: Subnet publica del destino SSH.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: Course
          Value: linux-desde-cero

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'SSH only from ${AllowedCidr}'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH from the authorized Linux client
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - Description: Outbound access for the Linux practice
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ssh-sg'

  Ec2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SshSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      CreditSpecification:
        CPUCredits: standard
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-instance'
        - Key: Course
          Value: linux-desde-cero

Outputs:
  StackName:
    Description: Stack que debes eliminar al terminar la practica.
    Value: !Ref AWS::StackName

  InstanceId:
    Description: ID de la EC2 destino.
    Value: !Ref Ec2Instance

  PublicIp:
    Description: IPv4 publica del destino SSH.
    Value: !GetAtt Ec2Instance.PublicIp

  PublicDnsName:
    Description: DNS publico del destino SSH.
    Value: !GetAtt Ec2Instance.PublicDnsName

  RemoteUser:
    Description: Usuario remoto de la AMI Ubuntu usada por el curso.
    Value: ubuntu

  SecurityGroupId:
    Description: Security Group que limita SSH al cliente.
    Value: !Ref SshSecurityGroup

  SshCommand:
    Description: Comando desde linux-course con la llave importada por la practica.
    Value: !Sub 'ssh -i ~/.ssh/linux-client-to-target ubuntu@${Ec2Instance.PublicDnsName}'
