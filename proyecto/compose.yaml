services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
    # El volumen Docker nace como root; este servicio local necesita escribir
    # su archivo SQLite dentro de él. La imagen nunca se publica ni va a AWS.
    user: "0:0"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:${LOCAL_DYNAMODB_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || test $$? -eq 22"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - local_dynamodb_data:/home/dynamodblocal/data

volumes:
  local_dynamodb_data:
