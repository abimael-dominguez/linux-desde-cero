name: consultor-linux

services:
  db:
    image: mariadb:11.8.8-noble
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 320m
    restart: unless-stopped
    logging: &limited-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  wordpress:
    image: wordpress:7.0.0-php8.3-apache
    entrypoint: ["/usr/local/bin/consultor-wordpress-entrypoint.sh"]
    command: ["apache2-foreground"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - wordpress_data:/var/www/html
      - ./apache/low-memory.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./php/consultor.ini:/usr/local/etc/php/conf.d/consultor.ini:ro
      - ./wordpress/entrypoint.sh:/usr/local/bin/consultor-wordpress-entrypoint.sh:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl --silent --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1/); case "$$code" in 200|301|302) exit 0;; *) exit 1;; esac
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 384m
    restart: unless-stopped
    logging: *limited-logging

  proxy:
    image: nginx:1.28.3-alpine
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped
    logging: *limited-logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  wordpress_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
